<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>林都小雪人 · 冰城一日 H5</title>
<style>
:root{--deep:#0d2b47;--navy:#123a5c;--accent:#e8833a;--cream:#ffd9a8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#060f1a;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:100%;height:100%;max-width:480px;overflow:hidden;background:#0d2b47;box-shadow:0 0 60px rgba(0,0,0,.6);touch-action:pan-y}
.shot{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .55s ease,transform .55s ease;transform:translateX(6%);display:flex;flex-direction:column}
.shot.on{opacity:1;pointer-events:auto;transform:none;z-index:2}
.shot.prev{transform:translateX(-6%)}
.vwrap{position:absolute;inset:0;z-index:0}
.vwrap video{width:100%;height:100%;object-fit:cover;background:#000}
.veil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,18,32,.72) 0%,rgba(6,18,32,0) 26%,rgba(6,18,32,0) 52%,rgba(6,18,32,.82) 100%);pointer-events:none}
.ui{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;padding:30px 24px 96px;pointer-events:none}
.chip{align-self:flex-start;font-size:11px;letter-spacing:3px;color:#ffe9cf;background:rgba(232,131,58,.9);padding:4px 12px;border-radius:99px}
.head{margin-top:12px;font-size:24px;color:#fff;font-weight:800;letter-spacing:2px;line-height:1.35;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.spacer{flex:1}
.narr{background:rgba(8,24,40,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;pointer-events:auto}
.narr p{font-size:14px;color:#f2f8fc;line-height:1.9;letter-spacing:.5px}
.narr b{color:var(--cream)}
.kw{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.kw span{font-size:10px;color:#cfe8f7;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:2px 8px;letter-spacing:1px}
.up{opacity:0;transform:translateY(18px);transition:all .7s cubic-bezier(.2,.7,.3,1)}
.on .up{opacity:1;transform:none}
.d1{transition-delay:.2s}.d2{transition-delay:.45s}
/* 开场页 */
#cover{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 40%,#173d61,#0a1e33 75%);transition:opacity .8s ease;text-align:center;padding:30px}
#cover.hide{opacity:0;pointer-events:none}
#cover h1{font-size:36px;color:#fff;font-weight:800;letter-spacing:4px;line-height:1.4}
#cover h1 em{font-style:normal;color:var(--cream)}
#cover .sub{color:rgba(255,255,255,.8);font-size:14px;letter-spacing:2px;line-height:2}
#playbtn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;font-size:16px;letter-spacing:6px;color:#123a5c;background:linear-gradient(180deg,#ffe9cf,#ffd9a8);padding:16px 54px;border-radius:99px;font-weight:800;box-shadow:0 10px 30px rgba(232,131,58,.45);transition:transform .2s}
#playbtn:active{transform:scale(.95)}
#cover .tip{color:rgba(255,255,255,.55);font-size:11px;letter-spacing:2px}
/* 进度条 */
#bar{position:absolute;top:0;left:0;height:4px;background:linear-gradient(90deg,#ffd9a8,#e8833a);z-index:9;width:0%;transition:width .2s linear}
/* 底部控制 */
#ctrl{position:absolute;bottom:16px;left:0;right:0;z-index:8;display:flex;align-items:center;justify-content:center;gap:18px}
#ctrl button{pointer-events:auto;border:1px solid rgba(255,255,255,.3);background:rgba(8,24,40,.6);color:#fff;font-family:inherit;font-size:12px;letter-spacing:2px;padding:8px 18px;border-radius:99px;cursor:pointer}
#shots-nav{position:absolute;bottom:56px;left:0;right:0;z-index:8;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 14px}
#shots-nav i{width:13px;height:5px;border-radius:99px;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
#shots-nav i.on{background:#ffd9a8;width:22px}
@keyframes fall{to{transform:translateY(110vh)}}
.flake{position:absolute;top:-20px;color:rgba(255,255,255,.8);z-index:2;animation:fall linear infinite;pointer-events:none}
/* 滑动气泡反馈 */
#swipe-tip{position:absolute;top:50%;z-index:7;transform:translateY(-50%);color:rgba(255,255,255,.85);font-size:26px;pointer-events:none;opacity:0;transition:opacity .25s;text-shadow:0 2px 10px rgba(0,0,0,.6)}
</style>
</head>

<div id="stage"><div id="frame">
  <div id="bar"></div>
  <div id="cover">
    <h1>林都小雪人<br><em>冰城一日</em></h1>
    <div class="sub">序章动画 + 九个镜头 · 一场冬天的小旅行<br>全程解说 · 支持手滑翻页</div>
    <button id="playbtn">开 始 播 放</button>
    <div class="tip">🖐 左右滑动 · 滚轮滚动 · 空格暂停</div>

  <div id="shots"></div>
  <div id="swipe-tip">›</div>
  <div id="shots-nav"></div>
  <div id="ctrl">
    <button id="prev">‹ 上一镜</button>
    <button id="pp">暂停</button>
    <button id="next">下一镜 ›</button>
    <button id="mute">🔊</button>
  </div>
</div></div>

qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqg=='};
const AC=window.AudioContext?new AudioContext():null;
let muted=false;
function playSnd(name){
  if(muted||!AC)return;
  try{
    const b=atob(SND[name]);const buf=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++)buf[i]=b.charCodeAt(i);
    if(!SND[name+'::buf'])SND[name+'::buf']=AC.decodeAudioData(buf.buffer);
    SND[name+'::buf'].then(ab=>{const src=AC.createBufferSource();src.buffer=ab;src.connect(AC.destination);src.start();}).catch(()=>{});
  }catch(e){}
}
/* ====== 构建 ====== */
const box=document.getElementById('shots');
box.innerHTML=shots.map((s,i)=>`
 <div class="shot" id="sh${i}">
  <div class="vwrap"><video src="${s.v}" playsinline preload="auto"></video><div class="veil"></div></div>
  <div class="ui">
    <div class="chip up">${s.pro?'序章 · PROLOGUE':'镜头 '+(i-1)+'/9'}</div>
    <div class="head up d1">${s.t}</div>
    <div class="spacer"></div>
    <div class="narr up d2"><p>${s.cap}</p>
      <div class="kw">${s.kw.map(k=>`<span># ${k}</span>`).join('')}</div>
    </div>
  </div>
 </div>`).join('');
document.getElementById('shots-nav').innerHTML=shots.map((_,i)=>`<i onclick="go(${i},true)"></i>`).join('');
document.querySelectorAll('.shot').forEach(sc=>{for(let i=0;i<7;i++){const f=document.createElement('div');f.className='flake';f.style.cssText=`left:${Math.random()*100}%;font-size:${8+Math.random()*10}px;animation-duration:${7+Math.random()*8}s;animation-delay:-${Math.random()*8}s`;f.textContent='❄';sc.appendChild(f);}});
const vids=[...document.querySelectorAll('video')];
let cur=-1,playing=false,timer=null,raf=null;
const bar=document.getElementById('bar');
function go(i,manual){
  i=Math.max(0,Math.min(shots.length-1,i));
  if(i===cur)return;
  const fwd=i>cur;
  if(cur>=0){vids[cur].pause();vids[cur].currentTime=0;}
  cur=i;
  document.querySelectorAll('.shot').forEach((s,k)=>{s.classList.toggle('on',k===cur);s.classList.toggle('prev',k<cur);});
  document.querySelectorAll('#shots-nav i').forEach((d,k)=>d.classList.toggle('on',k===cur));
  playSnd('whoosh');
  if(fwd&&shots[cur].pro&&cur===1)playSnd('ding');
  if(!fwd&&cur===shots.length-1)playSnd('fanfare');
  const v=vids[cur];
  if(playing){tryPlay(v);restartTimer();}
}
function tryPlay(v){
  v.muted=false;
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
}
function restartTimer(){
  clearInterval(timer);cancelAnimationFrame(raf);
  const v=vids[cur];
  const tick=()=>{
    const p=Math.min(100,((cur+(v.duration?v.currentTime/v.duration:0))/shots.length)*100);
    bar.style.width=p+'%';
    if(playing&&!v.paused)raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
  timer=setInterval(()=>{
    const v2=vids[cur];
    if(!playing)return;
    if(v2.paused){tryPlay(v2);}
    if(v2.duration&&v2.currentTime>=v2.duration-0.05){ if(cur<shots.length-1){go(cur+1);} else {finish();} }
  },200);
}
function finish(){
  playing=false;clearInterval(timer);cancelAnimationFrame(raf);
  document.getElementById('pp').textContent='重播';
  playSnd('fanfare');
  bar.style.width='100%';
}
/* ====== 控制 ====== */
document.getElementById('next').onclick=()=>go(cur+1,true);
document.getElementById('prev').onclick=()=>go(cur-1,true);
const pp=document.getElementById('pp');
pp.onclick=()=>{
  if(!playing&&pp.textContent==='重播'){bar.style.width='0%';go(0,true);playing=true;pp.textContent='暂停';tryPlay(vids[0]);restartTimer();return;}
  playing=!playing;
  pp.textContent=playing?'暂停':'播放';
  if(playing){tryPlay(vids[cur]);restartTimer();}else{vids[cur].pause();cancelAnimationFrame(raf);}
};
document.getElementById('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊';vids.forEach(v=>{if(cur!==null)v.muted=muted;});};
/* ====== 手滑(Pointer 事件,视频上也能滑)====== */
const fr=document.getElementById('frame');
const tip=document.getElementById('swipe-tip');
let px=null,py=null,pt=null;
fr.addEventListener('pointerdown',e=>{px=e.clientX;py=e.clientY;pt=Date.now();});
fr.addEventListener('pointermove',e=>{
  if(px===null)return;
  const dx=e.clientX-px;
  if(Math.abs(dx)>24){tip.textContent=dx>0?'‹':'›';tip.style.opacity=Math.min(.9,Math.abs(dx)/120);tip.style.left=dx>0?'18px':'auto';tip.style.right=dx>0?'auto':'18px';}
});
function endPointer(e){
  if(px===null)return;
  const dx=e.clientX-px,dy=e.clientY-py,dt=Date.now()-pt;
  tip.style.opacity=0;
  if(dt<800&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){
    if(dx<-50){go(cur+1,true);}
    else if(dx>50){go(cur-1,true);}
  }
  px=py=null;
}
fr.addEventListener('pointerup',endPointer);
fr.addEventListener('pointercancel',()=>{px=py=null;tip.style.opacity=0;});
/* 滚轮(横向+纵向都翻页) */
let wl=null;
fr.addEventListener('wheel',e=>{
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  const now=Date.now();if(wl&&now-wl<500)return;
  if(d>15){wl=now;go(cur+1,true);}else if(d<-15){wl=now;go(cur-1,true);}
},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(cur+1,true);
  if(e.key==='ArrowLeft')go(cur-1,true);
  if(e.key===' '){e.preventDefault();pp.click();}
});
/* ====== 开始 ====== */
document.getElementById('playbtn').onclick=()=>{
  if(AC&&AC.state==='suspended')AC.resume();
  document.getElementById('cover').classList.add('hide');
  playing=true;pp.textContent='暂停';
  cur=-1;go(0,false);
  tryPlay(vids[0]);
  playSnd('fanfare');
};
</script>
</body>
